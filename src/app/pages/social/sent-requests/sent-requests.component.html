<main class="main d-flex justify-content-center">
    <div class="social-center-panel d-flex flex-column overflow-hidden bg-white">
        <div class="social-header-container">
            <app-social-navigation></app-social-navigation>
            <div class="social-header-information  d-flex justify-content-center p-5">
                <h1>
                    {{ requests.length > 0 ? requests.length + (requests.length > 1 ? ' requests' : ' request') : 'None' }}
                </h1>
            </div>
        </div>
        <section class="social-cards-list flex-grow-1 overflow-auto">
            @for (request of requests; track request) {
                <app-sent-request-card
                        [requestID]="request"
                        [userID]="user?.id!"
                        (cancelRequestEmitter)="cancelRequest($event)"
                ></app-sent-request-card>
            }
        </section>
    </div>
</main>
