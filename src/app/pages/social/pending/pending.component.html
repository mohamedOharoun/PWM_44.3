<main class="main d-flex align-items-center justify-content-center">
    <div class="d-flex flex-column w-50 overflow-hidden bg-white h-100">
        <div class="social-header-container">
            <app-social-navigation></app-social-navigation>
            <div class="social-header-information  d-flex justify-content-center p-5">
                <h1>
                    {{ pending.length > 0 ? pending.length + (pending.length > 1 ? ' friends' : ' friend') : 'None' }}
                </h1>
            </div>
        </div>
        <section class="social-cards-list flex-grow-1 overflow-auto">
            @for (request of pending; track request) {
                <app-pending-card
                        [pendingID]="request"
                        [userID]="user?.id!"
                        (acceptRequestEmitter)="acceptRequest($event)"
                        (cancelRequestEmitter)="cancelRequest($event)"
                ></app-pending-card>
            }
        </section>
    </div>
</main>
