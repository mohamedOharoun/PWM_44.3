<main class="main d-flex justify-content-center">
    <div class="d-flex flex-column w-50 overflow-hidden bg-white">
        <div class="social-header-container">
            <app-social-navigation></app-social-navigation>
            <div class="social-header-information gap-3 d-flex justify-content-center p-5">
                <h1>
                    {{ groups.length > 0 ? groups.length + (groups.length > 1 ? ' pending requests' : ' pending requests') : 'None' }}
                </h1>
                <i (click)="showGroupCreationForm()" class="bi-plus-circle fs-1"></i>
            </div>
        </div>
        <section class="social-cards-list flex-grow-1 overflow-auto">
            @for (group of groups; track group) {
                <app-group-card
                        [groupID]="group"
                ></app-group-card>
            }
        </section>
    </div>
</main>
