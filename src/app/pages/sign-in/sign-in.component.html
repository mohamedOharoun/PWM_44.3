<main class="main-container">
  <div class="sign-in-container">
    <img src="/icons/logo.svg" alt="JoinUp Logo" class="logo-image" id="logo-image">
    <h1 class="sign-in-title">Log In</h1>
    <form id="sign-in-form" class="sign-in-form">
      <div class="form-group">
        <label for="email-input" class="form-label">Email Address</label>
        <input name="email" [(ngModel)]="email" type="email" id="email-input"
               class="form-input" placeholder="johndoe@example.com" required>
      </div>
      <div class="form-group">
        <label for="password-input" class="form-label">Password</label>
        <input name="password" [(ngModel)]="password" type="password" id="password-input"
               class="form-input" placeholder="********" required>
      </div>
      <span id="error-message-container" class="error-message">Incorrect email or password</span>
      <div class="options">
        <a href="/signUpFirst" id="register-link" class="link">Create an account</a>
      </div>
      <div class="button-container">
        <button type="button" (click)="signIn()" class="btn-gradient">LOG IN</button>
      </div>
    </form>
  </div>
</main>
