<main>
  <div class="d-flex justify-content-center align-items-center vh-100">
    <div
      class="d-flex flex-column align-items-center justify-content-center rounded-circle shadow p-4 bg-white text-center"
      style="width: 800px; height: 800px">
      <img src="/icons/logo.svg" alt="JoinUp Logo" class="input-icon mb-3" style="width: 100px; height: 100px"
           id="logo-image">
      <h1 class="fw-bold mb-4" style="font-size: 80px;">Log In</h1>

      <form id="sign-in-form" class="w-75">
        <div class="mb-3 d-flex flex-column align-items-center">
          <label for="email-input" class="form-label fs-3">Email Address</label>
          <input type="email" id="email-input"
                 class="form-control text-center fs-3"
                 placeholder="johndoe@example.com"
                 style="border: none; border-bottom: 2px solid #000; border-radius: 0; box-shadow: none;
                width: 500px;"
                 required>
        </div>

        <div class="mb-3 d-flex flex-column align-items-center">
          <label for="password-input" class="form-label fs-3">Password</label>
          <input type="password" id="password-input" class="form-control text-center fs-3"
                 placeholder="********"
                 style="border: none; border-bottom: 2px solid #000; border-radius: 0; box-shadow: none;
                 width: 500px"
                 required>
        </div>

        <span id="error-message-container" class="text-danger d-none">Incorrect email or password</span>

        <div class="options d-flex align-items-center justify-content-center gap-3 my-4">
          <div class="form-check">
            <input type="checkbox" id="keep-logged-button" class="form-check-input">
            <label for="keep-logged-button" class="form-check-label fs-5 ">Keep me signed in</label>
          </div>

          <hr class="vr" style="height: 20px; border: 1px solid black;">

          <a href="reset_password_page.html" id="forgot-password-link" class="text-decoration-none text-muted fs-5">Forgot
            password?</a>

          <hr class="vr" style="height: 20px; border: 1px solid black;">

          <a href="sign_up.html" id="register-link" class="text-decoration-none text-muted fs-5">Create an account</a>
        </div>
        <div class="d-flex justify-content-center w-100 mt-4">
          <div class="w-auto">
            <app-generic-button text="LOG IN" buttonClass="solid-button w-100"></app-generic-button>
          </div>
        </div>
      </form>
    </div>
  </div>
</main>
