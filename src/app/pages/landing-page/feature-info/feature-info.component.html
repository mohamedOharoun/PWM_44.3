<article class="feature-info d-flex flex-column align-items-center text-center p-3">
  <div class="feature-info-figure d-flex justify-content-center align-items-center rounded-circle overflow-hidden w-40 h-40 mb-3">
    <img [src]="imageSrc" [alt]="title" class="feature-info-img w-100 h-100 object-fit-cover">
  </div>
  <div class="feature-info-body">
    <p class="feature-title fw-bold">{{ title }}</p>
    <p class="feature-info-text">{{ description }}</p>
  </div>
</article>
