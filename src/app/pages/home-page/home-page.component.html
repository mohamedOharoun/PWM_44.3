<main>
  <article class="d-flex justify-content-between align-items-center gap-3 main-content">
    <div class="d-flex flex-column align-items-center gap-3 p-3" style="width: 50%;">
      <h1 class="home-title text-white fw-bold">{{ title }}</h1>
      <p class="text text-white">{{ textInfo }}</p>

      <div class="button-container d-flex align-items-center gap-3">
        <app-generic-button [text]="firstButton" routerLink="/eventCreationFirst"></app-generic-button>
        <app-generic-button [text]="secondButton" routerLink="/groupCreation"></app-generic-button>
      </div>
    </div>
    <section class="photo-container flex-grow-1">
      <img [src]="photo" alt="Home image" class="img-fluid" style="object-fit: cover; aspect-ratio: 645 / 385;">
    </section>
  </article>

  <div id="second-info-container" class="d-flex justify-content-center align-items-center">
    <section id="info-container" class="d-flex justify-content-between p-4 my-4 rounded-3 shadow-lg bg-white">

    </section>
  </div>
</main>
