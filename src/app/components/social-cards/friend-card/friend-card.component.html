<article class="social-card d-flex gap-3 p-5 m-2 align-items-center p-3">
    <div class="social-card-image-container overflow-hidden">
        <img src="https://picsum.photos/200">
    </div>
    @defer (when user) {
        <div class="social-card-text-container">
            {{ user.username }}
        </div>
    }
    <div class="d-flex ms-auto gap-2 social-card-utils-icons-container">
        <i (click)="blockUser()" class="bi-person-x fs-3"></i>
        <i (click)="removeUser()" class="bi-person-dash fs-3"></i>
        <i (click)="chatWithUser()" class="bi-chat fs-3"></i>
    </div>
</article>
