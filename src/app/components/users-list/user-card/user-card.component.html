<article class="user-card">
  @defer (when user) {
    <div class="user-card-image-container">
      <img [src]="user.image ? user.image : 'icons/logo.svg'">
    </div>
    <div class="user-card-name">
      {{ user.username }}
    </div>
  }
  <div class="user-card-icons">
    @if (!disableIcons) {
      <img (click)="remove()" class="user-card-icon" src="icons/cancel_circle.svg" alt="Close Icon">
    }
  </div>
</article>
