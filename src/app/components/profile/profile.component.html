<header class="profile-header">
  <div class="profile-title-container">
    <h1 class="profile-title">{{ userData.username}}´s Profile</h1>
    <div class="profile-utils-icons">
      <!-- Íconos de utilidades aquí -->
    </div>
  </div>
  <hr>
</header>

<div class="profile-body">
  <div class="profile-content">
    <div class="upload-photo-container drop-area">
      <div class="uploaded-img-container">
        <img class="uploaded-img" [src]="userData.profileImage" alt="Profile Image">
      </div>
      <input type="file" #fileInput id="fileElem" accept="image/*" (change)="handleFileInput($event)" style="display: none;">
      <label for="fileElem" class="upload-label" (click)="fileInput.click()">Upload photo</label>
    </div>

    <div class="profile-info">
      <label class="user-full-name">
        <input class="animated-input" type="text" [(ngModel)]="userData.fullName" [readonly]="true">
      </label>
      <label class="user-name">
        <input class="animated-input" type="text" [(ngModel)]="userData.username" [readonly]="true">
      </label>
      <label class="user-email">
        <input class="animated-input" type="text" [(ngModel)]="userData.email" [readonly]="true">
      </label>
    </div>
  </div>

  <div class="profile-description-container">
    <label class="description">
      <textarea class="animated-input" [(ngModel)]="userData.description" [readonly]="true"></textarea>
    </label>
  </div>

  <div class="events-sections-container">
    <section class="events-section user-events-section">
      <details>
        <summary>{{ userEvents.title }}</summary>
        <div class="user-events-content summary-content">
          <ng-container *ngIf="userEvents.events.length > 0; else noUserEvents">
            <!-- Aquí puedes iterar sobre los eventos del usuario -->
            <div *ngFor="let event of userEvents.events">
              <!-- Contenido del evento -->
            </div>
          </ng-container>
          <ng-template #noUserEvents>
            <p>No tienes eventos creados.</p>
          </ng-template>
        </div>
      </details>
    </section>

    <section class="events-section shared-events-section">
      <details>
        <summary>{{ sharedEvents.title }}</summary>
        <div class="shared-events-content summary-content">
          <ng-container *ngIf="sharedEvents.events.length > 0; else noSharedEvents">
            <!-- Aquí puedes iterar sobre los eventos compartidos -->
            <div *ngFor="let event of sharedEvents.events">
              <!-- Contenido del evento compartido -->
            </div>
          </ng-container>
          <ng-template #noSharedEvents>
            <p>No tienes eventos compartidos.</p>
          </ng-template>
        </div>
      </details>
    </section>
  </div>
</div>
