<app-input #member_input (focusin)="searchCoincidencesUsers(member_input.value)" (keyup)="searchCoincidencesUsers(member_input.value)" label="Member name"></app-input>
@if (searchedUsers.length) {
  <section class="users-suggestions">
    @for (user of searchedUsers; track user.id) {
      <article (click)="selectUser(user.id!)">{{user.username}}</article>
    }
  </section>
}
