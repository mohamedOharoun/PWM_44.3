<header class="page-header p-2">
    <img src="icons/logo.svg" width="50" height="50" class="me-3">
    <button (click)="toggleMenu()" class="toggle-menu-button bg-transparent border-0">
        <i class="bi-list d-flex align-items-center justify-content-center fs-1"></i>
    </button>
    <nav class="page-header-navigation">
        <ul class="header-navigation align-items-center list-unstyled pt-3">
            @for (link of navLinks; track $index) {
                <li (click)="navigateTo(link.route)" class="header-nav-text d-flex align-items-center">
                    {{ link.page }}
                </li>
            }
        </ul>
    </nav>
    <div id="page-header-buttons" class="ms-auto">
        <app-generic-button [text]="buttonText" routerLink="signUpFirst"></app-generic-button>
    </div>
</header>
