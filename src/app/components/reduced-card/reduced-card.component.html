<div class="card border-2 border-success p-3 m-2">
  <div class="card-header d-flex justify-content-between align-items-center pe-4">
    <div class="d-flex align-items-center">
      <h2 class="me-2 mb-0">{{ eventName }}</h2>
      <span class="mx-2 text-muted">&gt;</span>
      <span class="text-secondary">{{ eventCreator }}</span>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-light p-1">
        <img [src]="icons.report" alt="Flag" width="24" height="24">
      </button>
      <button class="btn btn-light p-1">
        <img [src]="icons.share" alt="Share" width="24" height="24">
      </button>
    </div>
  </div>

  <div class="card-body">
    <hr>
    <div class="d-flex justify-content-between flex-wrap mt-2">
      <section class="w-75">
        <h3 class="h5">{{ descriptionTitle }}</h3>
        <p class="text-muted">{{ descriptionText }}</p>
      </section>

      <section class="d-flex flex-column gap-2 w-25">
        <div class="d-flex align-items-center gap-2">
          <img [src]="icons.date" alt="Time" width="22" height="22">
          <span class="fs-6">{{ date }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <img [src]="icons.place" alt="Location" width="25" height="25">
          <span class="fs-6">{{ place }}</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <img [src]="icons.price" alt="Price" width="25" height="25">
          <span class="fs-6">{{ price }}</span>
        </div>
      </section>
    </div>

    <hr class="w-75">
    <div class="d-flex flex-wrap align-items-center gap-2 mt-3 mb-3 w-75">
      <span *ngFor="let tag of tags" class="badge bg-info text-dark px-3 py-2 rounded-pill">
        {{ tag }}
      </span>
    </div>
    <hr class="w-75">
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center">
    <div class="d-flex gap-3">
      <div class="d-flex align-items-center gap-1">
        <span class="fw-bold fs-5">{{ likes }}</span>
        <button class="btn btn-light p-1">
          <img [src]="icons.like" alt="Likes" width="24" height="24">
        </button>
      </div>
      <div class="d-flex align-items-center gap-1">
        <span class="fw-bold fs-5">{{ comments }}</span>
        <button class="btn btn-light p-1">
          <img [src]="icons.square" alt="Comments" width="24" height="24">
        </button>
      </div>
    </div>

    <div class="flex-grow-1 d-flex justify-content-center">
      <a href="../../pages/html/events.html" class="btn btn-outline-secondary">Ver más</a>
    </div>

    <div class="d-flex flex-column align-items-center gap-1" style="width: 21%; margin-top: -80px;">
      <a href="event_members.html" class="d-flex align-items-center justify-content-center w-100">
        <span class="fw-bold fs-3">{{ participants }}</span>
        <img [src]="icons.participants" alt="Participants" width="40" height="40">
      </a>
      <span class="fs-5 text-center w-100">{{ participantsLabel }}</span>
      <app-generic-button text="Join"></app-generic-button>
    </div>
  </div>
</div>
