<form #second_form="ngForm" class="d-flex flex-column gap-4">
    <div class="d-flex flex-column mb-4">
        <div class="input-with-icon gap-1 d-flex align-content-center">
            <i class="align-content-center bi-person"></i>
            <input #name_input="ngModel" name="name_input" type="text" [(ngModel)]="name" [ngClass]="'rotate-input'" class="flex-grow-1 border-0" placeholder="Full name*" required>
        </div>
    </div>
    <div class="d-flex flex-column mb-4">
        <div class="input-with-icon gap-1 d-flex align-content-center">
            <i class="align-content-center bi-person"></i>
            <input #username_input="ngModel" name="username_input" type="text" [(ngModel)]="username" class="flex-grow-1 border-0" placeholder="Choose your username*" required>
        </div>
    </div>
    <div class="d-flex flex-column mb-4">
        <div class="input-with-icon gap-1 d-flex align-content-center">
            <i class="align-content-center bi-calendar"></i>
            <input #birth_input="ngModel" name="birth_input" type="date" [(ngModel)]="birthDate" class="flex-grow-1 border-0" required>
        </div>
    </div>
    <div class="d-flex flex-column gap-1  mt-auto">
        <div class="d-flex">
            <div class="w-50 px-2">
                <app-generic-button (click)="changePage(previousStep, second_form)" text="PREVIOUS" buttonClass="transparent-button" class="w"></app-generic-button>
            </div>
            <div class="w-50 px-2">
                <app-generic-button (click)="changePage(nextStep, second_form)" text="NEXT" buttonClass="solid-button"></app-generic-button>
            </div>
        </div>
        <p class="w-100 text-center">
            Already have an account? Try <strong routerLink="/signin" class="sign-in-text">signing in.</strong>
            <br>
            <span class="text-danger">{{!second_form.valid ? 'Require fields must be filled.' : ''}}</span>
        </p>
    </div>
</form>
