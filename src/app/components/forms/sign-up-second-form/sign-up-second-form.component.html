<form #second_form="ngForm" class="form-container">
    <div class="form-group">
        <div class="input-with-icon">
            <i class="bi-person"></i>
            <input #name_input="ngModel" name="name_input" type="text" [(ngModel)]="name" [ngClass]="'rotate-input'" class="flex-grow-1" placeholder="Full name*" required>
        </div>
    </div>
    <div class="form-group">
        <div class="input-with-icon">
            <i class="bi-person"></i>
            <input #username_input="ngModel" name="username_input" type="text" [(ngModel)]="username" class="flex-grow-1" placeholder="Choose your username*" required>
        </div>
    </div>
    <div class="form-group">
        <div class="input-with-icon">
            <i class="bi-calendar">Age</i>
            <input #birth_input="ngModel" name="birth_input" type="date" [(ngModel)]="birthDate" class="flex-grow-1" required>
        </div>
    </div>
    <div class="form-footer">
        <div class="button-group">
            <div class="button-container">
                <app-generic-button (click)="changePage(previousStep, second_form)" text="PREVIOUS" buttonClass="transparent-button"></app-generic-button>
            </div>
            <div class="button-container">
                <app-generic-button (click)="changePage(nextStep, second_form)" text="NEXT" buttonClass="solid-button"></app-generic-button>
            </div>
        </div>
        <p>
            Already have an account? Try <strong routerLink="/signin" class="sign-in-text">signing in.</strong>
            <br>
            <span class="text-danger">{{!second_form.valid ? 'Require fields must be filled.' : ''}}</span>
        </p>
    </div>
</form>
