<div class="input-wrapper">
    <label class="form-label">{{ label }}</label>
    <div class="input-without-icon">
        <input
                name="name"
                [type]="type"
                [(ngModel)]="value"
                (ngModelChange)="emitValue()"
                class="form-control custom-input"
        />
    </div>
</div>
