<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8">
    <title>Chat</title>
    <script type="module" src="../../js/chat.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../../templates/css/header.css">
    <link rel="stylesheet" href="../../templates/css/footer.css">
    <link rel="stylesheet" href="../../templates/css/user_chat.css">
    <link rel="stylesheet" href="../../templates/css/message.css">
    <link rel="stylesheet" href="../../templates/css/message_input.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
<header id="page-header"></header>
<main>
    <div class="content">
        <button id="toggle-chat">TOGGLE</button>
        <div id="users-list-wrapper">
            <section id="chat-users-list" class="hidden-menu">
            </section>
        </div>
        <div id="current-chat">
            <div id="current-chat-name-container">
                <h1 id="current-chat-name"></h1>
                <hr>
            </div>
            <section id="messages-section">
            </section>
            <div id="message-input-container"></div>
        </div>
    </div>
</main>
<footer id="page-footer"></footer>
</body>
</html>
