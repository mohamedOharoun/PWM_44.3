<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8"/>
    <title>LandingPage</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../../js/index.js" defer></script>
    <link rel="stylesheet" href="../../templates/css/header.css">
    <link rel="stylesheet" href="../../templates/css/footer.css">
    <link rel="stylesheet" href="../../templates/css/feature_info.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
    <body>
        <header id="page-header"></header>
        <main>
            <div id="first-info-container">
                <div id="description">
                    <h1 class="index-title"></h1>
                    <p class="introduction">
                    </p>
                    <button id="main-button"></button>
                </div>

                <section id="main-photo-container"></section>
            </div>

            <div id="see-more-button-section">
                <a href="#features-info-section" id="see-more">
                    <p id="see-more-text"></p>
                    <img id="arrow" src="../../../assets/images/arrow.svg" alt="">
                </a>
            </div>

            <div id="second-info-container">
                <section id="features-info-section">
                    <article class="feature-info" id="add-friends"></article>
                    <article class="feature-info" id="explore-events"></article>
                    <article class="feature-info" id="split-payment"></article>
                </section>
            </div>
        </main>
        <footer id="page-footer"></footer>
    </body>
</html>
