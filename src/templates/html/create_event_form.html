<div id="event-form-title">
    <h1 id="create-event-title"></h1>
    <hr>
</div>
<div id="event-form-container">
    <form method="POST" action="">
        <div id="left-side" class="form-side">
            <label id="name-event" for="event-name"></label>
            <input id="event-name" name="event-name" type="text" required>
            <label id="date-event" for="event-date"></label>
            <input type="date" name="event-date" id="event-date" required>
            <label id="price-event" for="event-price"></label>
            <input type="number" step="0.01" name="event-price" id="event-price" value="0" min="0.00">
            <div id="privacy-container">
                <input type="checkbox" name="is-private" id="is-private">
                <label id="privacy-event" for="is-private"></label>
            </div>
            <label id="members-event" for="event-members-input"></label>
            <div id="members-input-container">
                <input class="animated-input" id="event-members-input" type="text">
                <div class="suggestions" id="suggestions"></div>
            </div>
            <div id="members-list-container">
                <section id="members-list-section"></section>
            </div>
        </div>
        <div id="right-side" class="form-side">
            <label id="description-event" for="event-description"></label>
            <textarea rows="20" id="event-description" name="event-description" required></textarea>
            <label id="tags-event" for="event-tags"></label>
            <input id="event-tags" name="event-tags" type="text">
            <div id="tags-section-container">
                <section id="tags-section">
                </section>
            </div>
            <button id="submit_button" type="submit">Lorem Ipsum</button>
        </div>
    </form>
</div>
